; ntripclient_G5-P3H — M5Atom Lite NTRIP client for a Septentrio mosaic-go G5 P3H rover.
;
; Build:  pio run
; Flash:  pio run -t upload
; Mon:    pio device monitor
;
; NOTE(upload_speed): M5 Atom Lite's CH9102F USB-serial is unreliable above
; 115200 on Linux — 230400+ almost always fails. Keep it at 115200.
;
; OTA (network flash):  pio run -e ota -t upload   (ArduinoOTA / espota)
; or upload a .bin from the web UI at http://ntrip-rover.local/ ("Firmware" section).

[platformio]
default_envs = m5stack-atom     ; `pio run` builds only the USB env by default

[env:m5stack-atom]
platform = espressif32
board = m5stack-atom            ; ESP32-PICO, 4MB flash
framework = arduino
monitor_speed = 115200
upload_speed = 115200           ; CH9102F: do NOT raise (see note above)

; OTA-capable layout: two ~1.9MB app slots (+ small SPIFFS). The ~1.45MB firmware
; fits with headroom, and the second slot is what makes OTA possible.
board_build.partitions = min_spiffs.csv

build_src_filter =
    +<*.cpp>

; Receiver-agnostic core (skyplot/stats UI, NMEA parse, captive portal, provisioning).
; For local core hacking, swap the URL for: symlink:///home/yasu/ntripclient-core
lib_deps =
    https://github.com/yasunorioi/ntripclient-core.git
    https://github.com/yasunorioi/NTRIP-client-for-Arduino.git
    m5stack/M5Unified @ ^0.2.5
    tzapu/WiFiManager @ ^2.0.17
    fastled/FastLED @ ^3.7.0

; Network flash over WiFi:  pio run -e ota -t upload
[env:ota]
extends = env:m5stack-atom
upload_protocol = espota
upload_port = ntrip-rover.local
